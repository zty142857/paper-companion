name: build-packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-14
            target: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install patchelf

      - name: Build package
        shell: bash
        run: |
          set -o pipefail
          python packaging/build.py --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.target }} 构建失败日志"
            echo '```text'
            tail -n 80 build.log 2>/dev/null || echo "build.log 不存在"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show toolchain versions
        if: always()
        run: |
          python --version
          node --version
          npm --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-companion-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
