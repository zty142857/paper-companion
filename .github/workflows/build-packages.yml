name: build-packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: ubuntu-22.04
            target: linux-x64
          # macOS Intel（macos-x64）暂无法构建：PyMuPDF 2.0 只发布 arm64 的 macOS wheel
          # （onnxruntime 同样已停止发布 macOS x86_64 wheel），版面/表格功能依赖它，
          # 强行从源码编译 MuPDF 也不现实。恢复构建前先确认上游恢复 x86_64 支持。
          # macOS 14 runner 已于 2026-11-02 退役，改用受支持的 macOS 15（arm64）
          - os: macos-15
            target: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Download formula OCR model (release builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd frontend
          npm run model:download

      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install patchelf

      - name: Run backend tests
        shell: bash
        run: |
          set -e
          python tests/test_formula_regions.py
          python tests/test_page_continuation.py
          python tests/test_translate_selection.py
          python tests/test_table_regions.py
          python tests/test_model_settings.py

      - name: Build package
        shell: bash
        run: |
          set -o pipefail
          extra=""
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            # 分支/PR 构建不下载 77MB 公式模型，允许产出不带公式识别的包
            extra="--allow-missing-model"
          fi
          python packaging/build.py --target ${{ matrix.target }} $extra 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.target }} 构建失败日志"
            echo '```text'
            tail -n 80 build.log 2>/dev/null || echo "build.log 不存在"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show toolchain versions
        if: always()
        run: |
          python --version
          node --version
          npm --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-companion-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载三平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dist

          # 清理历史遗留的"空 Release"（例如上次附件上传失败留下的）
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
                        --json tagName,assets \
                        --jq '.[] | select((.assets|length)==0) | .tagName'); do
            echo "清理空 Release: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true
          done

          cat > notes.md <<'EOF'
          ## 论文阅读智能学伴

          解压即用，**不需要安装 Python 或 Node**。

          ### 本版亮点
          - **批量上传**：一次拖入或选择多篇 PDF，后台逐篇解析，某篇失败可单独重试，不影响其余论文
          - **划词翻译**：拖选正文点「译」，选区旁即时显示译文，自动结合所在段落理解语境
          - **跨页段落合并**：段落跨页时翻译 / 追问 / 导读不再只拿到半段，页码显示「第 N–M 页」
          - **表格阅读**：点击表格查看 / 复制图片 /「问这张表」；表题进入导读，表内文字不再污染正文摘要
          - **多提供商模型设置**：翻译与其他任务可分别绑定不同提供商和模型，内置 200+ 家 OpenAI 兼容服务商目录
          - **切换论文不再串台**：卡片、标亮、搜索、公式结果按论文隔离，切换后旧请求不会覆盖新论文
          - **导读更可靠**：部分小节生成失败时保留上次结果，不再用占位内容覆盖已有导读
          - **文献综述**只允许选择已生成导读的论文，前后端都会给出明确提示
          - **内存修复**：缩放 / 换文档时正确释放 pdf.js 文档与文字层，长时间阅读不再越用越卡
          - **本地 API 加固**：只接受本机 Host，并校验 Origin / Sec-Fetch-Site，挡住 DNS rebinding 与跨站写操作
          - 修复删除 / 复制论文、表格重新识别、术语锚点等若干数据一致性问题
          - 公式识别仍是本地 OCR，模型随包提供，首次识别无需联网下载

          ### 下载哪个？
          | 你的系统 | 下载文件 |
          | --- | --- |
          | Windows 64 位 | `paper-companion-win-x64.zip` |
          | macOS Apple 芯片（M1/M2/M3/M4） | `paper-companion-macos-arm64.zip` |
          | Linux 64 位 | `paper-companion-linux-x64.tar.gz` |

          > macOS Intel 暂不提供免安装包，可按 README 从源码运行。

          ### 怎么启动
          1. 解压压缩包
          2. 双击启动脚本：Windows 用 `start.bat`；macOS 右键 `start.command` → 打开；Linux 执行 `./start.sh`
          3. 浏览器会自动打开（默认 http://127.0.0.1:8765 ）
          4. 首次使用点右上角「模型设置」，填入你自己的 Base URL、API Key、模型名

          ### 说明
          - 论文、笔记、卡片全部保存在本机 `data` 文件夹，不上传任何服务器
          - 只有调用 AI 功能时会把相关片段发送给你配置的模型服务商
          - macOS 首次打开会提示「无法验证开发者」，右键 → 打开 即可
          EOF

          # 只上传压缩包，不要把解压后的目录也当成附件
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/*.zip dist/*.tar.gz
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "论文阅读智能学伴 ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              dist/*.zip dist/*.tar.gz
          fi
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --json tagName,assets
