name: build-packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-14
            target: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install patchelf

      - name: Build package
        shell: bash
        run: |
          set -o pipefail
          python packaging/build.py --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.target }} 构建失败日志"
            echo '```text'
            tail -n 80 build.log 2>/dev/null || echo "build.log 不存在"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show toolchain versions
        if: always()
        run: |
          python --version
          node --version
          npm --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-companion-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载四平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh dist

          # 清理历史遗留的"空 Release"（例如上次附件上传失败留下的）
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
                        --json tagName,assets \
                        --jq '.[] | select((.assets|length)==0) | .tagName'); do
            echo "清理空 Release: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true
          done

          cat > notes.md <<'EOF'
          ## 论文阅读智能学伴

          解压即用，**不需要安装 Python 或 Node**。

          ### 下载哪个？
          | 你的系统 | 下载文件 |
          | --- | --- |
          | Windows 64 位 | `paper-companion-win-x64.zip` |
          | macOS Apple 芯片（M1/M2/M3/M4） | `paper-companion-macos-arm64.zip` |
          | macOS Intel 芯片 | `paper-companion-macos-x64.zip` |
          | Linux 64 位 | `paper-companion-linux-x64.tar.gz` |

          ### 怎么启动
          1. 解压压缩包
          2. 双击启动脚本：Windows 用 `start.bat`；macOS 右键 `start.command` → 打开；Linux 执行 `./start.sh`
          3. 浏览器会自动打开（默认 http://127.0.0.1:8765 ）
          4. 首次使用点右上角「模型设置」，填入你自己的 Base URL、API Key、模型名

          ### 说明
          - 论文、笔记、卡片全部保存在本机 `data` 文件夹，不上传任何服务器
          - 只有调用 AI 功能时会把相关片段发送给你配置的模型服务商
          - macOS 首次打开会提示「无法验证开发者」，右键 → 打开 即可
          EOF

          # 只上传压缩包，不要把解压后的目录也当成附件
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/*.zip dist/*.tar.gz
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "论文阅读智能学伴 ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              dist/*.zip dist/*.tar.gz
          fi
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --json tagName,assets
